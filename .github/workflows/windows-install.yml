name: Windows installer smoke test
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test
        required: true
permissions:
  contents: read
jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install release and check shortcuts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release download $env:RELEASE_TAG --pattern Zhizhi-Writer-Setup-x64.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $result = Start-Process .\Zhizhi-Writer-Setup-x64.exe -ArgumentList '/S' -Wait -PassThru
          if ($result.ExitCode) { throw "Installer returned $($result.ExitCode)" }
          $root = Join-Path $env:LOCALAPPDATA 'Programs\ZhizhiWriter'
          if (Get-ChildItem $root -Filter *.gguf -Recurse) { throw 'Installer contains a model' }
          $link = Join-Path ([Environment]::GetFolderPath('DesktopDirectory')) '致知文章仿写.lnk'
          if (!(Test-Path $link)) { throw 'Desktop shortcut missing' }
          $inspectionCopy = Join-Path $env:RUNNER_TEMP 'writer-shortcut.lnk'
          Copy-Item -LiteralPath $link -Destination $inspectionCopy
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($inspectionCopy)
          Write-Host "Launcher: $($shortcut.TargetPath) $($shortcut.Arguments)"
          python -c "import os,sys; assert os.path.samefile(sys.argv[1],sys.argv[2])" $shortcut.TargetPath "$root\python\python.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $scriptPath = $shortcut.Arguments -replace '^-B\s+',''
          python -c "import os,sys; assert os.path.samefile(sys.argv[1],sys.argv[2])" $scriptPath.Trim('"') "$root\writer.py"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Start-Process -FilePath $link
          Start-Sleep -Seconds 3
          $service = Get-CimInstance Win32_Process -Filter "name='python.exe'" | Where-Object { $_.ExecutablePath -eq $shortcut.TargetPath -and $_.CommandLine -like '*writer.py*' }
          if (!$service) { throw 'Launching desktop shortcut did not start the writing service' }
          Stop-Process -Id $service.ProcessId
      - name: Import external GGUF, reject a broken replacement, restart and generate
        shell: pwsh
        run: |
          $model = Join-Path $env:RUNNER_TEMP 'model.gguf'
          curl.exe -fL --retry 2 -o $model 'https://huggingface.co/openbmb/MiniCPM-V-4-gguf/resolve/main/ggml-model-Q4_K_M.gguf?download=true'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((Get-FileHash $model).Hash -ne 'b0ff610e9c92b30389ff1e0dd40fffed3c1f02a9d34a735fd5fba6a5ad25672b') { throw 'Model digest mismatch' }
          python tests/check_model_import.py "$env:LOCALAPPDATA\Programs\ZhizhiWriter" $model
