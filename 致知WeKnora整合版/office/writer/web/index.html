<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="session" content="__SESSION__"><title>致知 · 文章仿写</title>
<link rel="stylesheet" href="./ui.css"><script type="module" src="./ui.js"></script></head>
<body><header><div class="bar"><div class="brand"><img class="brand-logo" src="./logo.png" alt="致知"><span>致知写作</span></div><span class="offline"><i></i>本机离线</span></div></header>
<main><h1>文章仿写</h1><div class="desk">
<section class="setup" aria-label="仿写设置">
<div class="modelRow"><div><strong>本地模型</strong><p id="modelState" role="status">正在读取模型状态…</p></div><button class="quiet" id="chooseModel" disabled>导入模型</button></div>
<input id="modelFile" type="file" accept=".gguf" hidden>
<h2>参考范文</h2>
<div class="tabs" aria-label="范文输入方式"><button id="fileTab" aria-pressed="true">选择文件</button><button id="pasteTab" aria-pressed="false">粘贴正文</button></div>
<div id="filePanel">
<button id="drop" class="drop" aria-label="选择或更换范文文件"><span class="docIcon" aria-hidden="true">≡</span><strong id="fileTitle">选择或拖入范文</strong><small id="fileMeta">DOCX、TXT、Markdown · 最大 8 MB</small></button>
<input id="file" type="file" accept=".docx,.txt,.md" hidden>
<label id="historyLabel" class="history" hidden>已存范文<select id="history"><option value="">选择曾用文章</option></select></label>
<details id="preview" hidden><summary>查看范文原文</summary><pre id="sourceText"></pre></details>
</div>
<div id="pastePanel" hidden><label class="sr" for="sample">范文正文</label><textarea id="sample" rows="6" placeholder="将参考文章的正文粘贴到这里…" maxlength="500000"></textarea></div>
<div class="topic"><label for="topic">新文章主题与要求</label><textarea id="topic" rows="5" maxlength="2000" placeholder="写什么、写给谁？也可以补充需要采用的事实或字数要求。"></textarea></div>
<button class="primary" id="generate" disabled>开始仿写 <span aria-hidden="true">↗</span></button>
<button class="stop" id="stop" hidden>停止生成</button>
<p class="status" id="status" role="status">选好范文并填写新主题后即可开始。</p>
</section>
<section class="paper" aria-label="新稿编辑区"><div class="paperHead"><h2>新稿</h2><small id="count">0 字</small></div>
<div id="formatBar" class="formatBar" role="group" aria-label="新稿格式">
<select aria-label="段落样式"><option value="p">正文</option><option value="1">大标题</option><option value="2">小标题</option></select>
<button data-command="toggleBold" data-format="bold" aria-label="加粗" title="加粗"><b>B</b></button>
<button data-command="toggleItalic" data-format="italic" aria-label="斜体" title="斜体"><i>I</i></button>
<button data-command="toggleUnderline" data-format="underline" aria-label="下划线" title="下划线"><u>U</u></button>
<button data-command="toggleBulletList" data-format="bulletList" title="无序列表">项目符号</button>
<button data-command="toggleOrderedList" data-format="orderedList" title="有序列表">编号</button>
<button data-command="toggleBlockquote" data-format="blockquote">引用</button>
<button data-command="undo" aria-label="撤销" title="撤销">↶</button>
<button data-command="redo" aria-label="重做" title="重做">↷</button>
</div>
<div id="draft"></div><pre id="stream" aria-label="生成中的新稿" hidden></pre>
<div class="paperFoot"><span id="paperState">等待起草</span><div><button class="quiet" id="copy" disabled>复制全文</button><button class="quiet" id="exportWord" disabled>导出 Word</button><button class="quiet" id="export" disabled>导出 TXT</button></div></div>
</section></div></main></body></html>
