<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="session" content="__SESSION_KEY__"><title>致知办公助手 · 本地工作台</title><link rel="stylesheet" href="./ui.css"><script defer src="./ui.js"></script></head><body>
<header><div class="brand"><span>知</span>致知办公助手</div><nav aria-label="功能导航"></nav></header>
<main><p id="status" role="status"></p>
<section id="library"><h1>知识库</h1><div class="cols"><article><h2>添加文章</h2><label>材料用途<select id="role"><option>资料</option><option>范文</option><option>生活指南</option></select></label><label>标题<input id="title" maxlength="160"></label><label>正文<textarea id="body" rows="12" placeholder="粘贴文章，或从本地文件导入"></textarea></label><div class="actions"><label class="file">导入文件<input id="importDoc" type="file" accept=".docx,.txt,.md"></label><button id="saveDoc">存入知识库</button></div></article><article><h2>已存材料</h2><div id="docs"></div><h2>检索原文</h2><label>检索范围<select id="searchRole"><option>资料</option><option>范文</option><option>生活指南</option></select></label><input id="searchQuery" placeholder="输入关键词"><button id="search">按关键词检索</button><div id="hits"></div></article></div></section>
<section id="write" hidden><h1>公文起草与仿写</h1><div class="cols"><article><label>参考范文<select id="style"></select></label><div class="actions"><button type="button" id="pickStyle" aria-describedby="styleFormats">上传范文</button><input type="file" id="importStyle" accept=".docx,.txt,.md" hidden><small id="styleFormats">Word（.docx）、TXT、Markdown，最大 8 MB。导入后存入本地范文库。</small></div><label>新文章主题与要求<textarea id="topic" rows="5" maxlength="650" placeholder="例如：仿照所选文章的叙述方式，写一篇社区书屋开放日的通讯"></textarea></label><button id="compose">检索资料并起草</button><div id="profile"></div><h2>本次参考资料</h2><div id="sources"></div></article><article><label>可编辑草稿<textarea id="draft" rows="16" placeholder="草稿生成后可编辑，再校验；也可粘贴文章校验" maxlength="3200"></textarea></label><div class="actions"><button id="check">校验当前稿</button><button id="exportDraft" class="minor">导出 TXT</button></div><div id="review"></div></article></div></section>
<section id="tables" hidden><h1>表格管理</h1><article><div class="actions"><select id="sheets" aria-label="已保存表格"></select><button id="newTable">新表</button><label class="file">导入 CSV / TSV<input type="file" id="importTable" accept=".csv,.tsv"></label></div><label>表名<input id="tableName" maxlength="160"></label><div id="grid"></div><div class="actions"><button id="prev" class="minor">上一页</button><span id="page"></span><button id="next" class="minor">下一页</button><button id="addRow">加行</button><button id="addCol">加列</button><button id="saveTable">保存表格</button><button id="exportTable" class="minor">导出 CSV</button><button id="delTable" class="minor">删除表格</button></div></article></section>
<section id="tool" hidden><h1 id="toolTitle"></h1><div class="cols"><article><div id="imagePanel" hidden><label class="file">选择 PNG / JPEG<input type="file" id="image" accept="image/png,image/jpeg"></label><img id="preview" hidden alt="已选图片"></div><label id="toolLabel" for="input"></label><textarea id="input" rows="12"></textarea><button id="run">开始处理</button></article><article><h2>结果</h2><div class="output" id="result"></div><div id="toolSources"></div></article></div></section>
</main></body></html>
