<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>多维分析</title>
<link rel="icon" href="图标/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/theme.css">
<script>
/* 截图防护：本程序截屏一律调用系统截图工具，禁用浏览器屏幕共享选择器
   （getDisplayMedia 会弹出「选择要分享什么」窗口，必须彻底屏蔽） */
(function () {
  try {
    var md = navigator.mediaDevices;
    if (md) {
      try { delete md.getDisplayMedia; } catch (e) {}
      try { Object.defineProperty(md, 'getDisplayMedia', { value: undefined, configurable: true, writable: true }); } catch (e) {}
    }
    try { delete navigator.getDisplayMedia; } catch (e) {}
    try { Object.defineProperty(navigator, 'getDisplayMedia', { value: undefined, configurable: true, writable: true }); } catch (e) {}
  } catch (e) {}
})();
</script>
<script src="../bridge-session.js"></script>
</head>
<body>

  <header class="app-header">
    <div class="hero-row">
      <img class="app-logo" id="appLogo" alt="多维分析" src="图标/logo.svg">
      <h1 class="app-title"><span class="title-text" id="titleText">多维分析</span></h1>
      <div class="op-group" id="opRecord">
        <button class="btn op-btn2" data-kind="datamanage" onclick="recBtn1Click(this,'datamanage')">数据管理</button>
        <button class="btn op-btn2" data-kind="project" onclick="recBtn1Click(this,'project')">项目梳理</button>
        <button class="btn op-btn2" data-kind="relation" onclick="recBtn1Click(this,'relation')">关系分析</button>
      </div>
      <!-- 点击一级按钮后，右侧展开的水平工具栏（record.js 注入内容） -->
      <div id="recTier3" class="hidden"></div>
      <!-- 项目编辑检索：占用顶栏右侧空白区 -->
      <div class="rec-proj-search-wrap hidden" id="recProjSearchWrap">
        <input type="text" id="recSearchInput" class="rec-search-box" placeholder="检索项目内容" oninput="recDoSearch()" value="">
        <span class="rec-search-count" id="recSearchCount">0/0</span>
        <button class="setbar-mini" onclick="recSearchPrev()" title="上一个命中">上一条</button>
        <button class="setbar-mini" onclick="recSearchNext()" title="下一个命中">下一条</button>
        <label class="setbar-only"><input type="checkbox" id="recSearchOnlyChk" onchange="recToggleSearchOnly()">仅匹配</label>
      </div>
      <!-- 数据管理检索：占用顶栏右侧空白区，宽度自适应 -->
      <div class="rec-data-search-wrap hidden" id="recDataSearchWrap">
        <span class="rec-data-search-pill">
          <svg class="rec-data-search-ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.6"></circle><path d="M10.4 10.4 14 14"></path></svg>
          <input type="text" class="rec-data-search" id="recDataSearch" placeholder="检索项目主题 / 人物主题" oninput="recDataFilter(this.value)">
        </span>
      </div>
      <!-- 右上角切换徽标：默认显示本地服务状态，单击切换为署名；再单击切回并重新检测 -->
      <div class="rec-svc-status" id="recSvcStatus" role="button" tabindex="0" title="正在检测本地服务…" onclick="recSvcStatusClick()" onkeydown="recSvcStatusKey(event)">
        <span class="rec-svc-live"><span class="rec-svc-dot"></span><span class="rec-svc-text">检测中…</span></span>
        <span class="rec-svc-brand"><span class="rec-svc-brand-name">周 冉</span><span class="rec-svc-brand-plain">制作</span><span class="rec-svc-brand-date">20261102</span><span class="rec-svc-brand-plain">更新</span></span>
      </div>
    </div>
    <input type="file" id="recFileInput" accept=".js" style="display:none" onchange="handleRecFileInput(this)">
  </header>

  <main class="app-main">
    <!-- 中部主体：record.js 加载时自动注入 #tab-record 面板 -->
    <div class="middle-area"></div>
  </main>

  <div class="app-footer">
    <div class="setbar hint-toggle" id="hintToggle" role="button" tabindex="0" aria-label="单击切换：设置 / 操作说明" title="单击切换：设置 / 操作说明">
      <div class="setbar-view setbar-settings">
        <div class="setbar-dual" id="setbarDual">
          <span class="setbar-dual-item" id="setbarDualProj">未选择项目主题</span>
          <span class="setbar-dual-item" id="setbarDualRel">未选择人物主题</span>
        </div>
        <span class="setbar-main" id="setbarMain">
          <span class="setbar-label" id="setbarThemeLabel">主题：</span>
          <span class="setbar-theme" id="setbarThemeName">未选择</span>
          <button class="setbar-save" id="setbarSaveBtn" title="保存当前主题（含附件）到「数据」文件夹；本地服务不可用时先存缓存，再选择文件保存" onclick="event.stopPropagation();recSaveThemeJs()">保存</button>
        </span>
        <span class="setbar-reltip" id="setbarRelTip"></span>
        <div class="setbar-mode" id="setbarModeGroup"></div>
      </div>
      <div class="setbar-view setbar-hint">
        <span class="footer-hint"><span class="hint-view" id="hintView"><span class="hint-track" id="hintTrack"></span></span></span>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/platform.js"></script>
  <script src="js/logo.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/core.js"></script>
  <script src="js/path-picker.js"></script>
<script src="js/record.js"></script>
<script src="js/proj-editor.js"></script>
<script src="js/relation.js"></script>
  <script src="数据/项目信息/index.js"></script>
  <script src="数据/人物关系/index.js"></script>
  <script src="js/main.js"></script>
